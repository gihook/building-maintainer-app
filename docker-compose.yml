version: '3.8'

services:
  waha:
    image: devlikeapro/waha
    ports:
      - "${WAHA_PORT:-3000}:3000"
    restart: unless-stopped
    env_file: .env
    environment:
      - WAHA_LOG_LEVEL=${WAHA_LOG_LEVEL:-info}
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-}
    volumes:
      - waha_data:/app/.waha

volumes:
  waha_data:
