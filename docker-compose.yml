version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: building-maintainer-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MaintainerConfig__CredentialsPath=/app/credentials.json
      - WAHA_API_URL=http://waha:3000
    volumes:
      - ${CREDENTIALS_PATH:-./credentials.json}:/app/credentials.json:ro
    depends_on:
      - waha
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      - WAHA_HTTP_HOST=0.0.0.0
      - WAHA_HTTP_PORT=3000
    volumes:
      - waha_data:/app/.waha
    restart: unless-stopped

volumes:
  waha_data:
